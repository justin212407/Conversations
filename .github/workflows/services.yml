name: Service checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: services-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: conversations
          POSTGRES_PASSWORD: conversations_local
          POSTGRES_DB: conversations
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U conversations -d conversations"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable && corepack prepare pnpm@10.4.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm services:build
      - run: pnpm services:typecheck
      - run: pnpm services:lint
      - run: pnpm services:gate-lint
      - run: pnpm services:gate-test
      - run: pnpm legacy:test
      - run: pnpm services:test
      - run: pnpm --filter web test:integration
      - run: pnpm services:smoke
      - name: Deterministic isolated container lifecycle
        run: pnpm services:regression
      - name: Owned diagnostic shutdown with real DNS failure and healthy controls
        run: pnpm services:shutdown-regression
      - name: Verify private journal is not tracked
        run: test -z "$(git ls-files -- docs/local-change-log.md)"

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable && corepack prepare pnpm@10.4.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Whole-workspace high and critical dependency audit
        run: pnpm dependencies:audit

  frontend:
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable && corepack prepare pnpm@10.4.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm services:build
      - run: pnpm --filter web test
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web lint
      - name: Production frontend build with synthetic public configuration
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_c2VjdXJpdHktZml4dHVyZS5jbGVyay5hY2NvdW50cy5kZXYk
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
          NEXT_PUBLIC_API_URL: https://api.example.invalid
      - name: Install repository-pinned Chromium and hosted prerequisites
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Renderer and real-service browser lifecycle
        run: pnpm workspace:regression
      - name: Actual browser ownership, deadline and signal cleanup
        run: pnpm workspace:browser-test
