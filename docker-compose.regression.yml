# Run only through the repository verifier: all values and mounts are private per run.
# !override requires Docker Compose >=2.24.4; no development ports/config survive.
name: ${REGRESSION_PROJECT:?Use the service regression command}
x-runtime: &runtime
  NODE_ENV: test
  LOG_LEVEL: info
  REDIS_URL: redis://redis:6379
  METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:?}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
  TRACE_SAMPLE_RATIO: "1"
  OBSERVABILITY_ALLOW_PRIVATE_HTTP: "true"
  HEALTH_TIMEOUT_MS: "1500"
  SHUTDOWN_TIMEOUT_MS: "5000"
services:
  postgres:
    extends: { file: docker-compose.yml, service: postgres }
    ports: !override []
    environment:
      POSTGRES_PASSWORD: ${REGRESSION_DB_PASSWORD:?}
  redis:
    extends: { file: docker-compose.yml, service: redis }
    ports: !override []
  migrate:
    extends: { file: docker-compose.yml, service: migrate }
    image: ${REGRESSION_IMAGE:?}
    environment:
      <<: *runtime
      DATABASE_URL: ${REGRESSION_DATABASE_URL:?}
  api:
    extends: { file: docker-compose.yml, service: api }
    image: ${REGRESSION_IMAGE:?}
    restart: "no"
    ports: !override ["127.0.0.1:${REGRESSION_API_PORT:?}:4300"]
    environment:
      <<: *runtime
      DATABASE_URL: ${REGRESSION_DATABASE_URL:?}
      CLERK_SECRET_KEY: ""
      CLERK_JWT_ISSUER_DOMAIN: https://regression.clerk.accounts.dev
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:?}
      CLERK_AUTHORIZED_PARTIES: http://localhost:3000
      REALTIME_INTERNAL_SECRET: ${REALTIME_INTERNAL_SECRET:?}
      REALTIME_REDIS_PREFIX: ${REGRESSION_PROJECT:?}
      REALTIME_PUBLIC_URL: ws://127.0.0.1:${REGRESSION_REALTIME_PORT:?}/v1/connect
  worker:
    extends: { file: docker-compose.yml, service: worker }
    image: ${REGRESSION_IMAGE:?}
    restart: "no"
    command: [node, apps/worker/test/fixtures/container-worker.mjs]
    ports: !override ["127.0.0.1:${REGRESSION_WORKER_PORT:?}:4302"]
    volumes:
      - ${REGRESSION_WORKER_FIXTURE:?}:/app/apps/worker/test/fixtures/container-worker.mjs:ro,Z
    environment:
      <<: *runtime
      DATABASE_URL: ${REGRESSION_DATABASE_URL:?}
      GOOGLE_GENERATIVE_AI_API_KEY: ""
      TEXT_QUEUE_PREFIX: ${REGRESSION_PROJECT:?}
  realtime:
    extends: { file: docker-compose.yml, service: realtime }
    image: ${REGRESSION_IMAGE:?}
    restart: "no"
    ports: !override ["127.0.0.1:${REGRESSION_REALTIME_PORT:?}:4301"]
    environment:
      <<: *runtime
      REALTIME_INTERNAL_SECRET: ${REALTIME_INTERNAL_SECRET:?}
      REALTIME_REDIS_PREFIX: ${REGRESSION_PROJECT:?}
      REALTIME_PUBLIC_URL: ws://127.0.0.1:${REGRESSION_REALTIME_PORT:?}/v1/connect
      REALTIME_API_URL: http://api:4300
      REALTIME_ALLOW_PRIVATE_HTTP: "true"
      CLERK_AUTHORIZED_PARTIES: http://localhost:3000
      REALTIME_ACCESS_CHECK_MS: "1000"
      REALTIME_HEARTBEAT_MS: "1000"
  jaeger:
    extends: { file: docker-compose.observability.yml, service: jaeger }
    ports: !override ["127.0.0.1:${REGRESSION_JAEGER_PORT:?}:16686"]
  prometheus:
    extends: { file: docker-compose.observability.yml, service: prometheus }
    ports: !override ["127.0.0.1:${REGRESSION_PROM_PORT:?}:9090"]
    volumes: !override
      - ${REGRESSION_PROM_CONFIG:?}:/etc/prometheus/local.yml:ro,Z
volumes:
  postgres-data:
  redis-data:
